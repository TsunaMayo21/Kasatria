<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasatria - 3D Periodic Table Assignment</title>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
   
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login View (Image A) -->
    <div id="login-wrapper">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p>Lorem ipsum dolor sit amet, consectetuer adipiscing elit</p>
            <div id="g_id_onload"
                 data-client_id="180107808711-i1dpr9e8bg21fam1a5sodp7kro0cdaml.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large"></div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="modal-overlay">
        <div class="modal-content">
            <button id="modal-close">&times;</button>
            <img id="modal-photo" src="" alt="Profile Photo">
            <h3 id="modal-name"></h3>
            <p id="modal-details"></p>
        </div>
    </div>

    <!-- 3D Periodic Table View -->
    <div id="app-container">
        <div id="menu">
            <button id="table">TABLE</button>
            <button id="sphere">SPHERE</button>
            <button id="helix">HELIX</button>
            <button id="grid">GRID</button>
            <button id="reset-cam">RESET VIEW</button>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- TrackballControls for mouse rotate, pan, and zoom -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    

    <!-- Custom Application Script -->
    <script src="app.js"></script>
</body>
</html>
